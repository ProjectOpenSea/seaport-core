name: Auto-tag commit with YY-MM-DD/branchname

on:
  push:
    branches:
      - main
      - dev

# Pushes to the same branch tag in order, so the newest commit gets the tag.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tag-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create tag string
        id: tag
        run: echo "tag=$(date +%y-%m-%d)-${GITHUB_REF#refs/heads/}" >> "$GITHUB_OUTPUT"

      - name: Delete tag if exists
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if git rev-parse --verify --quiet "$TAG"; then
            git tag -d "$TAG"
            git push --delete origin "$TAG"
          fi

      - name: Tag commit with YY-MM-DD-branchname
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          git tag "$TAG"
          git push --tags --force
